name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GOAT/LOADER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NDK 25.1.8937393
        run: |
          $sdkmanager = Get-ChildItem -Path "$env:ANDROID_HOME" -Filter "sdkmanager.bat" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using sdkmanager: $sdkmanager"
          "y" * 20 | & $sdkmanager --licenses | Out-Null
          & $sdkmanager "ndk;25.1.8937393"
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Fix build_guest_bridge.ps1 integer sort
        shell: pwsh
        run: |
          $scriptPath = Join-Path (Get-Location) "tools\build_guest_bridge.ps1"
          $lines = Get-Content -Path $scriptPath
          $lines = $lines | ForEach-Object {
            if ($_ -match 'Sort-Object.*android-') {
              $_ -replace '\{\s*\[int\]\(\$_\.Name[^}]*\}', '{ if ($_.Name -match ''\d+'') { [int]$matches[0] } else { 0 } }'
            } else {
              $_
            }
          }
          Set-Content -Path $scriptPath -Value $lines
          $lines | Where-Object { $_ -match 'Sort-Object' }
      - run: .\gradlew.bat assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: GOAT/LOADER/app/build/outputs/apk/debug/*.apk
