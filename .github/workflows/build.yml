name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GOAT/LOADER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NDK 25.1.8937393
        run: |
          $sdkmanager = Get-ChildItem -Path "$env:ANDROID_HOME" -Filter "sdkmanager.bat" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using sdkmanager: $sdkmanager"
          "y" * 20 | & $sdkmanager --licenses | Out-Null
          & $sdkmanager "ndk;25.1.8937393"
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Fix build_guest_bridge.ps1 integer sort
        shell: pwsh
        run: |
          $scriptPath = "tools\build_guest_bridge.ps1"
          if (Test-Path $scriptPath) {
            $content = Get-Content -Path $scriptPath -Raw
            $content = $content -replace '\[int\]\(\$_\.Name\s+-replace\s+''\^android-'',''''\)', '[int](($_.Name -replace ''\D'','''') -as [int])'
            Set-Content -Path $scriptPath -Value $content -NoNewline
          }
      - run: .\gradlew.bat assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: GOAT/LOADER/app/build/outputs/apk/debug/*.apk
