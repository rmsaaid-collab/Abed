name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GOAT/LOADER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NDK 25.1.8937393
        run: |
          $sdkmanager = Get-ChildItem -Path "$env:ANDROID_HOME" -Filter "sdkmanager.bat" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using sdkmanager: $sdkmanager"
          "y" * 20 | & $sdkmanager --licenses | Out-Null
          & $sdkmanager "ndk;25.1.8937393"
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Fix build_guest_bridge.ps1 integer sort
        shell: pwsh
        run: |
          $p = "tools\build_guest_bridge.ps1"
          $content = Get-Content $p -Raw
          $content = [regex]::Replace($content, 'Sort-Object\s*\{[^\r\n]*\}', 'Sort-Object { ([regex]::Match($_.Name, "\d+").Value -as [int]) }')
          [System.IO.File]::WriteAllText((Resolve-Path $p), $content)
          Get-Content $p | Select-Object -First 15
      - run: .\gradlew.bat assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: GOAT/LOADER/app/build/outputs/apk/debug/*.apk
