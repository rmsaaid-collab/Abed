name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GOAT/LOADER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install NDK 25.1.8937393
        run: |
          $sdkmanager = Get-ChildItem -Path "$env:ANDROID_HOME" -Filter "sdkmanager.bat" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Using sdkmanager: $sdkmanager"
          "y" * 20 | & $sdkmanager --licenses | Out-Null
          & $sdkmanager "ndk;25.1.8937393"
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
      - name: Fix NDK path in build_loading_compat.ps1
        shell: pwsh
        run: |
          $ndkPath = Join-Path $env:ANDROID_HOME "ndk\25.1.8937393"
          "ANDROID_NDK_HOME=$ndkPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_NDK_ROOT=$ndkPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $compatScript = "tools\build_loading_compat.ps1"
          if (Test-Path $compatScript) {
            $raw = Get-Content -Path $compatScript -Raw
            $ndkEscaped = $ndkPath -replace '\\', '\\'
            $raw = [regex]::Replace($raw, '[A-Za-z]:\\[^"''\r\n]*?ndk\\25\.1\.8937393', $ndkEscaped)
            Set-Content -Path $compatScript -Value $raw -NoNewline
          }
      - run: .\gradlew.bat assembleDebug
      - name: Find built APKs
        shell: pwsh
        run: |
          Get-ChildItem -Path "app\build\outputs\apk" -Filter "*.apk" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: GOAT/LOADER/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
